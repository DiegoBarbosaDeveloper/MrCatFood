spring:
  application:
    name: MrCatFood
  # Desarrollo: solo se lee .env (ignorado por Git). En producción la plataforma
  # inyecta las variables de entorno; .env.produccion queda como respaldo local.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/mydatabase}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin123}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway es la única fuente del esquema: Hibernate solo comprueba que las entidades encajen.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  flyway:
    enabled: true
    locations: classpath:db/migration

seguridad:
  jwt:
    secreto: ${JWT_SECRETO}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:120}

whatsapp:
  numero: ${WHATSAPP_NUMERO}

cors:
  # Lista separada por comas; en producción se reemplaza con el dominio real.
  origenes-permitidos: ${CORS_ORIGENES_PERMITIDOS:http://localhost:8081}

pedidos:
  horario-inicio: ${PEDIDOS_HORARIO_INICIO:08:00}
  horario-fin: ${PEDIDOS_HORARIO_FIN:20:00}
  entrega-inicio: ${PEDIDOS_ENTREGA_INICIO:11:00}
  entrega-fin: ${PEDIDOS_ENTREGA_FIN:21:00}
  zona: ${PEDIDOS_ZONA:America/Bogota}
