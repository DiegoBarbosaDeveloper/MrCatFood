spring:
  application:
    name: MrCatFood
  # Desarrollo: solo se lee .env (ignorado por Git). En producción la plataforma
  # inyecta las variables de entorno; .env.produccion queda como respaldo local.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/mydatabase}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin123}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway es la única fuente del esquema: Hibernate solo comprueba que las entidades encajen.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  flyway:
    enabled: true
    locations: classpath:db/migration
